<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f8fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="消費税計算"><title>消費税計算</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#18212f;background:#f7f8fa}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}main{max-width:460px;margin:28px auto}h1{font-size:22px;margin:0 0 28px;font-weight:750}label{font-size:14px;color:#526072;font-weight:650}.inputrow{display:flex;gap:10px;margin-top:10px}input{min-width:0;flex:1;width:100%;font-size:36px;font-weight:650;border:2px solid #dce1e8;border-radius:15px;padding:15px 12px;background:white;color:#18212f;font-variant-numeric:tabular-nums}input:focus{outline:none;border-color:#2778df}button{font-family:inherit;cursor:pointer;touch-action:manipulation}.clear{border:1px solid #dce1e8;background:white;border-radius:14px;padding:0 17px;font-size:16px;color:#526072}.rates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.rate{border:2px solid #dce1e8;background:white;border-radius:16px;padding:19px 10px;font-size:25px;font-weight:750;color:#344256}.rate.active{background:#1768d4;border-color:#1768d4;color:white}.result{background:white;border-radius:20px;margin-top:24px;padding:25px 20px;box-shadow:0 2px 16px #1b34500a}.small{color:#69778a;font-size:14px}.total{font-size:clamp(36px,10vw,54px);font-weight:780;letter-spacing:-1.6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin:10px 0 24px}.taxline{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #e7ebf0;padding-top:18px;font-size:17px}.taxline strong{font-variant-numeric:tabular-nums}.hint{color:#778292;font-size:12px;line-height:1.6;margin-top:16px} @media(max-width:360px){.total{font-size:35px}}
</style></head><body><main><h1>消費税計算</h1><label for="amount">税抜金額（円）</label><div class="inputrow"><input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="金額を入力" aria-label="税抜金額"><button class="clear" id="clear" type="button">消去</button></div><div class="rates"><button class="rate active" type="button" data-rate="10" aria-pressed="true">10%</button><button class="rate" type="button" data-rate="8" aria-pressed="false">8%</button></div><section class="result" aria-live="polite"><div class="small">税込金額</div><div class="total" id="total">—</div><div class="taxline"><span class="small" id="taxLabel">消費税（10%）</span><strong id="tax">—</strong></div></section><p class="hint">端数処理なし・小数第2位まで表示。入力欄をタップすると金額をまとめて選択できます。</p></main><script>
(()=>{'use strict';const amount=document.getElementById('amount'),total=document.getElementById('total'),tax=document.getElementById('tax'),taxLabel=document.getElementById('taxLabel'),buttons=[...document.querySelectorAll('[data-rate]')];let rate=10;const format=v=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:2}).format(v);function render(){const raw=amount.value.replace(/[，,\s]/g,'').replace(/．/g,'.');if(!raw||!/^\d+(?:\.\d*)?$/.test(raw)){total.textContent='—';tax.textContent='—';return}const n=Number(raw);if(!Number.isFinite(n)){total.textContent='—';tax.textContent='—';return}const cents=Math.round(n*100);const taxCents=Math.round(cents*rate/100);total.textContent=format((cents+taxCents)/100)+' 円';tax.textContent=format(taxCents/100)+' 円'}amount.addEventListener('input',render);amount.addEventListener('focus',()=>amount.select());amount.addEventListener('click',()=>amount.select());document.getElementById('clear').addEventListener('click',()=>{amount.value='';render();amount.focus()});buttons.forEach(button=>button.addEventListener('click',()=>{rate=Number(button.dataset.rate);buttons.forEach(b=>{const active=b===button;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});taxLabel.textContent=`消費税（${rate}%）`;render()}));render()})();
</script></body></html>
